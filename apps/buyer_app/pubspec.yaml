name: buyer_app
description: White-label buyer app. One codebase; every tenant's build differs only in its config.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  marketplace_core:
    path: ../../packages/core
  package_info_plus: ^8.0.2
  sentry_flutter: ^8.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
