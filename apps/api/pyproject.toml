[project]
name = "ecomm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "prometheus-client>=0.26.0",
  "dnspython>=2.8.0",
  "pyotp>=2.10.0",
  "pillow>=12.3.0",
  "boto3>=1.43.96",
  "python-multipart>=0.0.32",
  "cryptography>=50.0.1",
  "tinycss2>=1.5.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "UP046", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "app.core.deps.require_tenant_staff", "app.core.deps.require_vendor_role"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S608", "ASYNC221", "E501"]
"migrations/**" = ["E501", "S608"]
# SQL fragments interpolated here are module constants (VISIBLE), never user input.
"app/modules/catalog/products.py" = ["S608"]
