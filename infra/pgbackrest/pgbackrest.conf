# ADR 0013: WAL archiving + base backups -> PITR (RPO <= 5 min).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
# Off-site copy (second BD location, S3-compatible MinIO)
repo2-type=s3
repo2-s3-endpoint=${OFFSITE_S3_ENDPOINT}
repo2-s3-bucket=pg-backups
repo2-s3-region=bd-offsite
repo2-path=/ecomm
repo2-retention-full=8
archive-async=y
archive-timeout=60
compress-type=zst
start-fast=y

[ecomm]
pg1-path=/var/lib/postgresql/data
