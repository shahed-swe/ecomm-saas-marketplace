# Local + single-node staging topology (ADR 0013). Production splits these across nodes.
name: ecomm
x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  APP_DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/ecomm
  APP_PLATFORM_DATABASE_URL: postgresql+asyncpg://platform:platform@postgres:5432/ecomm
  APP_MIGRATION_DATABASE_URL: postgresql+asyncpg://migrator:migrator@postgres:5432/ecomm
  APP_REDIS_URL: redis://redis:6379/0
  APP_PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-localtest.me}
  APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20 }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment: { VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-root}, VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200" }
    profiles: ["dev"]

  migrate:
    build: ../apps/api
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: ../apps/api
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"], interval: 10s }

  worker:
    build: ../apps/api
    environment: *api-env
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on: { api: { condition: service_healthy } }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment: { API_INTERNAL_URL: "http://api:8000" }
    depends_on: [api]

  caddy:
    image: caddy:2
    environment:
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-localtest.me}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports: ["80:80", "443:443"]
    depends_on: [web, api]
    profiles: ["edge"]

  prometheus:
    image: prom/prometheus:latest
    volumes: [./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    profiles: ["obs"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    profiles: ["obs"]
  loki:
    image: grafana/loki:latest
    profiles: ["obs"]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, caddydata: {} }
